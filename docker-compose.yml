services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tam_ung
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d tam_ung"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    container_name: api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tam_ung
      DB_USER: appuser
      DB_PASSWORD: change_me
      JWT_SECRET: ump-tam-ung-jwt-secret-change-in-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
